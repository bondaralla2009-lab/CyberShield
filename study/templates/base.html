<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}КиберЩит{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #00092F;
            color: #E5E9F0;
        }

        html {
            scroll-behavior: smooth;
        }

        .nav-button-left, .nav-button-right {
            color: #E5E9F0;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: 500;
            background: none;
            padding: 0;
            border: none;
            display: inline-block;
            line-height: 45px;
            cursor: pointer;
        }

        /* При наведении */
        .nav-button-left:hover,
        .nav-button-right:hover {
            color: #E5E9F0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .footer {
            background-color: #081246;
            padding: 30px;
            text-align: center;
            border-top: 2px solid #081246;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <p>© 2025 CyberShield - Защита от кибермошенников</p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
