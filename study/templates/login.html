<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - КиберЩит</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #00092F;
        }

        /* ФОТО НА ЗАДНЕМ ПЛАНЕ */
        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('/static/img/задний фон вход(рег).jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.6;
            z-index: 0;
            pointer-events: none;
        }

        /* Затемняющий слой */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,9,47,0.9) 0%, rgba(8,18,70,0.8) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 450px;
            margin: 20px;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: rgba(8, 18, 70, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 133, 0.2);
            border-radius: 32px;
            padding: 48px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 255, 133, 0.4);
            box-shadow: 0 30px 60px -12px rgba(0, 255, 133, 0.2);
        }

        .lock-icon {
            text-align: center;
            margin-bottom: 24px;
        }

        .lock-icon span {
            font-size: 4rem;
            filter: drop-shadow(0 0 15px #00FF85);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        h1 {
            color: #00FF85;
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: -0.5px;
            text-shadow: 0 0 20px rgba(0, 255, 133, 0.3);
        }

        .subtitle {
            color: #8892B0;
            text-align: center;
            margin-bottom: 36px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .flash-messages {
            margin-bottom: 24px;
        }

        .flash {
            background: rgba(255, 75, 75, 0.15);
            border-left: 4px solid #FF4B4B;
            padding: 16px;
            border-radius: 12px;
            color: #FF4B4B;
            font-size: 0.95rem;
            backdrop-filter: blur(4px);
            margin-bottom: 12px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            color: #E5E9F0;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-left: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            color: #00FF85;
            font-size: 1.2rem;
            opacity: 0.7;
        }

        .input-group input {
            width: 100%;
            padding: 16px 16px 16px 52px;
            border: 2px solid rgba(0, 255, 133, 0.2);
            border-radius: 16px;
            background: rgba(23, 42, 69, 0.6);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .input-group input:focus {
            outline: none;
            border-color: #00FF85;
            box-shadow: 0 0 0 4px rgba(0, 255, 133, 0.2);
            background: rgba(23, 42, 69, 0.8);
        }

        .input-group input::placeholder {
            color: rgba(136, 146, 176, 0.5);
        }

        .login-button {
            background: linear-gradient(135deg, #00FF85 0%, #00CC6A 100%);
            color: #00092F;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 16px;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 20px -5px rgba(0, 255, 133, 0.3);
        }

        .login-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 30px -5px rgba(0, 255, 133, 0.5);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .register-link {
            text-align: center;
            margin-top: 32px;
            color: #8892B0;
            font-size: 0.95rem;
        }

        .register-link a {
            color: #00FF85;
            text-decoration: none;
            font-weight: 600;
            margin-left: 8px;
            transition: all 0.3s ease;
            border-bottom: 1px dashed transparent;
        }

        .register-link a:hover {
            border-bottom-color: #00FF85;
        }

        .back-home {
            text-align: center;
            margin-top: 24px;
        }

        .back-home a {
            color: #8892B0;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-home a:hover {
            color: #00FF85;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .input-group input {
                padding: 14px 14px 14px 48px;
            }
        }
    </style>
</head>
<body>
<div class="background-image"></div>
<div class="overlay"></div>

<div class="login-container">
    <div class="login-card">
        <div class="lock-icon">
            <span>🔐</span>
        </div>

        <h1>Добро пожаловать</h1>
        <div class="subtitle">
            Войдите в свой аккаунт
        </div>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash-messages">
            {% for message in messages %}
            <div class="flash">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form method="POST" class="login-form">
            <div class="input-group">
                <label>ЛОГИН</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" name="username" placeholder="Введите логин" required autocomplete="off">
                </div>
            </div>

            <div class="input-group">
                <label>ПАРОЛЬ</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔑</span>
                    <input type="password" name="password" placeholder="Введите пароль" required autocomplete="off">
                </div>
            </div>

            <button type="submit" class="login-button">
                Войти
            </button>
        </form>

        <div class="register-link">
            Нет аккаунта?
            <a href="/register">Создать аккаунт</a>
        </div>

        <div class="back-home">
            <a href="/">← Вернуться на главную</a>
        </div>
    </div>
</div>
</body>
</html>
